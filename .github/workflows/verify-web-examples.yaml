name: Verify Web Examples

on: pull_request

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04]
                arch: [amd64]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Override config/ci.json
              run: |
                  echo '{"cosmos": {"enabled": false}}' > config/ci.json

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Compile EVM Smart Contracts
              run: |
                  pnpm run build

            - name: Create .env file and Generate Chains Config
              run: |
                  # Dummy private key created for testing purpose only, it is not secret
                  pnpm run setup
                  NODE_ENV=ci nohup pnpm run start &
                  sleep 5

            - name: Setup Web Examples
              run: |
                  cd examples-web
                  pnpm run setup

            - name: Deploy
              run: |
                  cd examples-web
                  pnpm run deploy
